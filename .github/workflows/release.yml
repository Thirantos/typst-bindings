name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  LIB_NAME: typst
  HEADER_PATH: typst.h

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_prefix: lib
            lib_ext: a
            archive_ext: tar.gz

          # This is currently not working correctly (error: failed to run custom build command for `openssl-sys v0.9.113`)
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   lib_prefix: lib
          #   lib_ext: so
          #   archive_ext: tar.gz
          #   use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            lib_prefix: lib
            lib_ext: a
            archive_ext: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            lib_prefix: lib
            lib_ext: a
            archive_ext: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_prefix: ""
            lib_ext: lib
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        env:
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          RELEASE_DIR="target/${{ matrix.target }}/release"
          mkdir -p staging

          # Static library
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$RELEASE_DIR/typst.lib" staging/
          else
            cp "$RELEASE_DIR/libtypst.a" staging/
          fi

          # Header
          cp typst.h staging/

      - name: Archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf ${{ matrix.target }}.tar.gz -C staging .

      - name: Archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath ${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
