[package]
name = "typst"
version = "0.1.0"
edition = "2024"
build = "build.rs"
[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
typst = "0.14.2"
comemo = "0.4"
zune-inflate = { version = "0.2", default-features = false, features = [
  "gzip",
  "std",
] }
tar = "0.4"
ureq = "2.9"
time = "0.3"
ttf-parser = "0.25"
typst-kit = { version = "0.14.2", features = ["embed-fonts"] }
typst-pdf = "0.14.2"
typst-svg = "0.14.2"

[build-dependencies]
cbindgen = "0.29.2"

